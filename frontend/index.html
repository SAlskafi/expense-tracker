<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-body-tertiary">

  <nav class="navbar  bg-dark">
    <div class="container-md">
      <span class="navbar-brand text-white ">Expense Tracker</span>
    </div>
  </nav>

  <div class="container mt-4">

    <div id="globalAlert" class="alert alert-danger d-none" role="alert"></div>

  </div>

  <div class=" container  mt-4  ">

    <div class="summary-cards ">

      <div class="card text-center h-100 shadow-sm ">
        <div class="card-body">
          <h6 class=" text-body-secondary">Total</h6>
          <h3 id="totalAmount"></h3>
        </div>
      </div>




      <div class="card text-center h-100 shadow-sm ">
        <div class="card-body">
          <h6 class=" text-body-secondary">Number Of Expenses</h6>
          <h3 id="numberOfExpenses"></h3>
        </div>
      </div>



      <div class="card text-center h-100 shadow-sm ">
        <div class="card-body">
          <h6 class=" text-body-secondary">Highest Expense</h6>
          <h3 id="highestAmount"></h3>
          <p class="card-text text-body-secondary" id="highestExpense"></p>
        </div>
      </div>



    </div>
  </div>


  <div class=" container  mt-4  bg-white p-4 shadow-sm">

    <h4> Add Expense</h4>


    <form class="row g-3" id="expenseForm" novalidate>

      <div class=" col-12 d-flex justify-content-center">
        <div class="spinner-border d-none" role="status" id="formSpinner">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <div class="col-md-4">
        <label for="inputTitle" class="form-label">Title</label>
        <input type="text" class="form-control" id="inputTitle" placeholder="Launch" required>
        <div id="titleError" class="text-danger small"></div>
      </div>


      <div class="col-md-2">
        <label for="inputAmount" class="form-label">Amount</label>
        <input type="number" class="form-control" id="inputAmount" placeholder="4.5" min="0.01" step="0.01" required>
        <div id="amountError" class="text-danger small"></div>
      </div>

      <div class="col-md-3">
        <label for="inputCategory" class="form-label">category</label>
        <select id="inputCategory" class="form-select" required>
          <option value="" selected disabled>Choose...</option>
          <option>Food</option>
          <option>Transport</option>
          <option>Bills</option>
          <option>Entertainment</option>
          <option>Other</option>
        </select>
        <div id="categoryError" class="text-danger small"></div>
      </div>

      <div class="col-md-3">
        <label for="inputDate" class="form-label">Date</label>
        <input type="date" class="form-control" id="inputDate" required>
        <div id="dateError" class="text-danger small"></div>
      </div>

      <div class="col-12">
        <button type="submit" class="btn btn-primary">Add expense</button>
      </div>




    </form>

  </div>


  <div class=" container  mt-4  bg-white p-4 shadow-sm">

    <div class="row g-3">

      <div class="col-md-9">
        <h4>Expenses</h4>
      </div>

      <div class="col-md-3 d-flex gap-3 align-items-center">


        <label for="filterCategory" class="form-label">category</label>
        <select id="filterCategory" class="form-select">
          <option value="" selected>All...</option>
          <option>Food</option>
          <option>Transport</option>
          <option>Bills</option>
          <option>Entertainment</option>
          <option>Other</option>
        </select>


      </div>

    </div>

    <div class="row g-3 mt-4">

      <div class="col-md-12">

        <div class=" col-12 d-flex justify-content-center">
          <div class="spinner-border d-none" role="status" id="tableSpinner">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>


        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="expensesTableBody">



            </tbody>

          </table>
        </div>
      </div>




    </div>
  </div>


  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Edit Expense</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal">
          </button>
        </div>

        <div class="modal-body">

          <div id="editAlert" class="alert alert-danger d-none" role="alert"></div>

          <div class="d-flex justify-content-center">
            <div class="spinner-border  d-none" role="status" id="modalSpinner">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>


          <input id="editTitle" type="text" class="form-control mb-3">
          <div id="editTitleError" class="text-danger small mb-2"></div>

          <input id="editAmount" type="number" class="form-control mb-3">
          <div id="editAmountError" class="text-danger small mb-2"></div>

          <select id="editCategory" class="form-select mb-3">


            <option value="" disabled>Select Category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>

          </select>
          <div id="editCategoryError" class="text-danger small mb-2"></div>

          <input id="editDate" type="date" class="form-control">
          <div id="editDateError" class="text-danger small mb-2"></div>
        </div>

        <div class="modal-footer">

          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Cancel
          </button>

          <button type="button" class="btn btn-primary" id="saveEditButton">
            Save
          </button>

        </div>

      </div>
    </div>
  </div>







  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
